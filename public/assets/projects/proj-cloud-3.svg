<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg12)"/>
  
  <rect x="30" y="20" width="540" height="300" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="20" width="540" height="36" rx="12" fill="#141E33"/>
  <rect x="30" y="44" width="540" height="12" fill="#141E33"/>
  <circle cx="50" cy="38" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="38" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="4.5" fill="#10B981"/>
  <text x="100" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ArgoCD GitOps • Kubernetes Canary Mesh</text>
  
  <rect x="440" y="27" width="115" height="22" rx="5" fill="#0E1726" stroke="#818CF8" stroke-width="1"/>
  <text x="497" y="42" fill="#818CF8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">ARGOCD • ISTIO • PROMETHEUS</text>
  
  
  
  <g transform="translate(45, 68)">
    <!-- ArgoCD Header Tile -->
    <rect x="0" y="0" width="510" height="60" rx="8" fill="#0F172A" stroke="#312E81"/>
    <text x="16" y="22" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">ArgoCD App: production-microservices (Cluster: k8s-us-east-1)</text>
    
    <rect x="16" y="32" width="75" height="20" rx="4" fill="#065F46"/>
    <text x="53" y="46" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">✓ Synced</text>
    <rect x="100" y="32" width="80" height="20" rx="4" fill="#065F46"/>
    <text x="140" y="46" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">♥ Healthy</text>
    <text x="200" y="46" fill="#94A3B8" font-family="monospace" font-size="9">Commit: git:a89fc2 (canary 10%)</text>

    <!-- Istio Traffic Splitter Diagram -->
    <rect x="0" y="70" width="510" height="165" rx="8" fill="#0A0E1A" stroke="#1E293B"/>
    <text x="16" y="92" fill="#A5B4FC" font-family="sans-serif" font-size="10" font-weight="bold">Istio VirtualService Canary Traffic Shifting: 90% Stable / 10% Canary</text>
    
    <!-- Ingress -->
    <rect x="20" y="125" width="85" height="48" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="62" y="145" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Istio Gateway</text>
    <text x="62" y="160" fill="#94A3B8" font-family="sans-serif" font-size="8" text-anchor="middle">10,000 req/m</text>

    <!-- Branch Lines -->
    <path d="M 105 140 L 160 120 L 180 120" stroke="#10B981" stroke-width="2.5"/>
    <path d="M 105 158 L 160 180 L 180 180" stroke="#818CF8" stroke-width="2.5"/>

    <!-- Stable Pods (90%) -->
    <rect x="180" y="98" width="220" height="45" rx="6" fill="#064E3B" stroke="#10B981"/>
    <text x="195" y="118" fill="#A7F3D0" font-family="sans-serif" font-size="10" font-weight="bold">Stable v1.4.2 (90% Traffic)</text>
    <text x="195" y="133" fill="#6EE7B7" font-family="sans-serif" font-size="8.5">3 Replicas • Error Rate: 0.00% • P95: 14ms</text>
    <rect x="410" y="105" width="85" height="30" rx="4" fill="#065F46"/>
    <text x="452" y="124" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">9,000 req/m</text>

    <!-- Canary Pods (10%) -->
    <rect x="180" y="158" width="220" height="45" rx="6" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="195" y="178" fill="#C7D2FE" font-family="sans-serif" font-size="10" font-weight="bold">Canary v1.5.0 (10% Traffic)</text>
    <text x="195" y="193" fill="#A5B4FC" font-family="sans-serif" font-size="8.5">1 Replica • Error Rate: 0.00% • P95: 12ms</text>
    <rect x="410" y="165" width="85" height="30" rx="4" fill="#312E81"/>
    <text x="452" y="184" fill="#C7D2FE" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">1,000 req/m</text>
  </g>
</svg>