<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180B2B"/><stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg7)"/>
  
  <rect x="30" y="20" width="540" height="300" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="20" width="540" height="36" rx="12" fill="#141E33"/>
  <rect x="30" y="44" width="540" height="12" fill="#141E33"/>
  <circle cx="50" cy="38" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="38" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="4.5" fill="#10B981"/>
  <text x="100" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">CNN Digit Classifier & Grad-CAM Heatmap</text>
  
  <rect x="440" y="27" width="115" height="22" rx="5" fill="#0E1726" stroke="#F472B6" stroke-width="1"/>
  <text x="497" y="42" fill="#F472B6" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">PYTORCH • MNIST • 99.2% ACC</text>
  
  
  
  <g transform="translate(45, 68)">
    <!-- Input Digit Panel -->
    <rect x="0" y="0" width="140" height="235" rx="8" fill="#0A0E1A" stroke="#1E293B"/>
    <text x="18" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">INPUT SAMPLE [28x28]</text>
    
    <!-- 28x28 Digit "7" representation -->
    <rect x="20" y="40" width="100" height="100" rx="6" fill="#000000" stroke="#374151"/>
    <path d="M 35 60 L 85 60 L 55 125" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="20" y="165" fill="#64748B" font-family="sans-serif" font-size="9">TRUE LABEL: <tspan fill="#F8FAFC" font-weight="bold">7</tspan></text>
    <text x="20" y="185" fill="#64748B" font-family="sans-serif" font-size="9">NORM: <tspan fill="#38BDF8">[-1.0, 1.0]</tspan></text>
    <text x="20" y="205" fill="#64748B" font-family="sans-serif" font-size="9">DEVICE: <tspan fill="#34D399">CUDA:0</tspan></text>

    <!-- CNN Architecture Arrow -->
    <path d="M 150 115 L 180 115" stroke="#F472B6" stroke-width="2"/>
    <polygon points="180,111 188,115 180,119" fill="#F472B6"/>

    <!-- Middle: Feature Activations -->
    <rect x="195" y="0" width="140" height="235" rx="8" fill="#0A0E1A" stroke="#1E293B"/>
    <text x="210" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="bold">CONV2D FILTERS</text>
    
    <rect x="210" y="40" width="45" height="45" rx="4" fill="#1E1B4B" stroke="#6366F1"/>
    <text x="232" y="66" fill="#A5B4FC" font-family="sans-serif" font-size="8" text-anchor="middle">Conv 1</text>
    <rect x="270" y="40" width="45" height="45" rx="4" fill="#1E1B4B" stroke="#6366F1"/>
    <text x="292" y="66" fill="#A5B4FC" font-family="sans-serif" font-size="8" text-anchor="middle">Conv 2</text>
    
    <rect x="210" y="95" width="45" height="45" rx="4" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="232" y="121" fill="#C7D2FE" font-family="sans-serif" font-size="8" text-anchor="middle">Pool 1</text>
    <rect x="270" y="95" width="45" height="45" rx="4" fill="#1E1B4B" stroke="#818CF8"/>
    <text x="292" y="121" fill="#C7D2FE" font-family="sans-serif" font-size="8" text-anchor="middle">Dense</text>
    
    <text x="210" y="170" fill="#F472B6" font-family="sans-serif" font-size="10" font-weight="bold">PREDICTED:</text>
    <text x="210" y="200" fill="#FFFFFF" font-family="sans-serif" font-size="28" font-weight="bold">7</text>
    <text x="240" y="200" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="bold">99.8%</text>

    <!-- Arrow to Grad-CAM -->
    <path d="M 345 115 L 375 115" stroke="#F472B6" stroke-width="2"/>
    <polygon points="375,111 383,115 375,119" fill="#F472B6"/>

    <!-- Right: Grad-CAM Saliency Overlay -->
    <rect x="390" y="0" width="120" height="235" rx="8" fill="#0A0E1A" stroke="#F472B6"/>
    <text x="402" y="24" fill="#F472B6" font-family="sans-serif" font-size="10" font-weight="bold">GRAD-CAM SALIENCY</text>
    
    <g transform="translate(400, 40)">
      <rect x="0" y="0" width="100" height="100" rx="6" fill="#1E1B4B"/>
      <!-- Heatmap circles around stroke of 7 -->
      <circle cx="35" cy="20" r="14" fill="#F43F5E" opacity="0.8"/>
      <circle cx="65" cy="20" r="18" fill="#F59E0B" opacity="0.9"/>
      <circle cx="50" cy="55" r="15" fill="#EF4444" opacity="0.8"/>
      <circle cx="35" cy="85" r="12" fill="#E11D48" opacity="0.7"/>
      <path d="M 15 20 L 65 20 L 35 85" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <text x="402" y="165" fill="#94A3B8" font-family="sans-serif" font-size="8.5">Top-right crossbar</text>
    <text x="402" y="180" fill="#94A3B8" font-family="sans-serif" font-size="8.5">accounts for 78% of</text>
    <text x="402" y="195" fill="#34D399" font-family="sans-serif" font-size="8.5" font-weight="bold">model activation.</text>
  </g>
</svg>