<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg3)"/>
  
  <rect x="30" y="20" width="540" height="300" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="20" width="540" height="36" rx="12" fill="#141E33"/>
  <rect x="30" y="44" width="540" height="12" fill="#141E33"/>
  <circle cx="50" cy="38" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="38" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="4.5" fill="#10B981"/>
  <text x="100" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Distributed URL Engine & Metrics Cluster</text>
  
  <rect x="440" y="27" width="115" height="22" rx="5" fill="#0E1726" stroke="#C084FC" stroke-width="1"/>
  <text x="497" y="42" fill="#C084FC" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">5,240 REQ/SEC • P95 11.8MS</text>
  
  
  
  <g transform="translate(45, 68)">
    <!-- Metrics Row -->
    <rect x="0" y="0" width="160" height="54" rx="8" fill="#1E1B4B" stroke="#4338CA"/>
    <text x="14" y="20" fill="#A5B4FC" font-family="sans-serif" font-size="9" font-weight="bold">THROUGHPUT</text>
    <text x="14" y="42" fill="#F8FAFC" font-family="sans-serif" font-size="17" font-weight="bold">5,240 RPS</text>

    <rect x="175" y="0" width="160" height="54" rx="8" fill="#1E1B4B" stroke="#4338CA"/>
    <text x="189" y="20" fill="#A5B4FC" font-family="sans-serif" font-size="9" font-weight="bold">REDIS CACHE HIT</text>
    <text x="189" y="42" fill="#34D399" font-family="sans-serif" font-size="17" font-weight="bold">99.4% Hits</text>

    <rect x="350" y="0" width="160" height="54" rx="8" fill="#1E1B4B" stroke="#4338CA"/>
    <text x="364" y="20" fill="#A5B4FC" font-family="sans-serif" font-size="9" font-weight="bold">BLOOM FILTER</text>
    <text x="364" y="42" fill="#38BDF8" font-family="sans-serif" font-size="17" font-weight="bold">0.01% False Pos</text>

    <!-- Architecture Flow Diagram -->
    <rect x="0" y="68" width="510" height="95" rx="8" fill="#0A0E1A" stroke="#1E293B"/>
    <text x="15" y="86" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="bold">SYSTEM ARCHITECTURE PIPELINE</text>
    
    <!-- Node 1: Edge Router -->
    <rect x="15" y="100" width="85" height="48" rx="6" fill="#1E293B" stroke="#38BDF8"/>
    <text x="57" y="120" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Nginx LB</text>
    <text x="57" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Round Robin</text>

    <!-- Arrow 1 -->
    <path d="M 105 124 L 130 124" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Node 2: FastAPI Cluster -->
    <rect x="135" y="100" width="105" height="48" rx="6" fill="#1E293B" stroke="#818CF8"/>
    <text x="187" y="120" fill="#A5B4FC" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">FastAPI x4</text>
    <text x="187" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8.5" text-anchor="middle">Base62 + Token</text>

    <!-- Arrow 2 -->
    <path d="M 245 124 L 270 124" stroke="#818CF8" stroke-width="2"/>

    <!-- Node 3: Redis Ring -->
    <rect x="275" y="100" width="105" height="48" rx="6" fill="#1E293B" stroke="#C084FC"/>
    <text x="327" y="120" fill="#E879F9" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">Redis Cluster</text>
    <text x="327" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8.5" text-anchor="middle">LRU Eviction</text>

    <!-- Arrow 3 -->
    <path d="M 385 124 L 410 124" stroke="#C084FC" stroke-width="2"/>

    <!-- Node 4: PostgreSQL -->
    <rect x="415" y="100" width="85" height="48" rx="6" fill="#1E293B" stroke="#34D399"/>
    <text x="457" y="120" fill="#6EE7B7" font-family="sans-serif" font-size="10" text-anchor="middle" font-weight="bold">PostgreSQL</text>
    <text x="457" y="136" fill="#94A3B8" font-family="sans-serif" font-size="8.5" text-anchor="middle">B-Tree Indexes</text>

    <!-- Latency Chart -->
    <rect x="0" y="174" width="510" height="65" rx="8" fill="#111827" stroke="#1E293B"/>
    <text x="15" y="192" fill="#64748B" font-family="sans-serif" font-size="9">P95 LATENCY WAVE (SUB-15MS SLA):</text>
    <path d="M 15 224 Q 70 210, 120 220 T 220 215 T 320 222 T 420 214 T 495 218" fill="none" stroke="url(#pulse)" stroke-width="2.5"/>
    <circle cx="495" cy="218" r="4" fill="#38BDF8"/>
    <text x="450" y="202" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">11.8 ms</text>
  </g>
</svg>