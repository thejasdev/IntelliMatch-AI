<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/><stop offset="100%" stop-color="#1C2541"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg11)"/>
  
  <rect x="30" y="20" width="540" height="300" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="20" width="540" height="36" rx="12" fill="#141E33"/>
  <rect x="30" y="44" width="540" height="12" fill="#141E33"/>
  <circle cx="50" cy="38" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="38" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="4.5" fill="#10B981"/>
  <text x="100" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Terraform Multi-AZ VPC Cloud Topology</text>
  
  <rect x="440" y="27" width="115" height="22" rx="5" fill="#0E1726" stroke="#38BDF8" stroke-width="1"/>
  <text x="497" y="42" fill="#38BDF8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">AWS VPC • ASG • RDS MULTI-AZ</text>
  
  
  
  <g transform="translate(45, 68)">
    <!-- VPC Boundary -->
    <rect x="0" y="0" width="510" height="235" rx="8" fill="#0A0E1A" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="6"/>
    <text x="14" y="20" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">AWS VPC: 10.0.0.0/16 (us-east-1 Region)</text>
    
    <!-- Public Subnet (ALB + NAT) -->
    <rect x="15" y="32" width="480" height="56" rx="6" fill="#0C253B" stroke="#0369A1"/>
    <text x="25" y="48" fill="#7DD3FC" font-family="sans-serif" font-size="9" font-weight="bold">PUBLIC SUBNETS (AZ-A / AZ-B) • Internet Gateway</text>
    <rect x="140" y="56" width="105" height="24" rx="4" fill="#0284C7"/>
    <text x="192" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">ALB Load Balancer</text>
    <rect x="270" y="56" width="105" height="24" rx="4" fill="#0284C7"/>
    <text x="322" y="72" fill="#FFFFFF" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">NAT Gateway x2</text>

    <!-- Arrow -->
    <path d="M 255 88 L 255 100" stroke="#38BDF8" stroke-width="2"/>

    <!-- Private Compute Subnet (Auto-scaling group) -->
    <rect x="15" y="102" width="480" height="62" rx="6" fill="#111C33" stroke="#1D4ED8"/>
    <text x="25" y="118" fill="#93C5FD" font-family="sans-serif" font-size="9" font-weight="bold">PRIVATE APPLICATION SUBNETS • Auto Scaling Group</text>
    
    <rect x="80" y="128" width="95" height="26" rx="4" fill="#1E293B" stroke="#38BDF8"/>
    <text x="127" y="145" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">EC2 Instance 1</text>
    <rect x="205" y="128" width="95" height="26" rx="4" fill="#1E293B" stroke="#38BDF8"/>
    <text x="252" y="145" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">EC2 Instance 2</text>
    <rect x="330" y="128" width="95" height="26" rx="4" fill="#1E293B" stroke="#38BDF8"/>
    <text x="377" y="145" fill="#38BDF8" font-family="sans-serif" font-size="9" text-anchor="middle">EC2 Instance 3</text>

    <!-- Arrow -->
    <path d="M 255 164 L 255 174" stroke="#38BDF8" stroke-width="2"/>

    <!-- Database Subnet -->
    <rect x="15" y="174" width="480" height="52" rx="6" fill="#141E28" stroke="#059669"/>
    <text x="25" y="190" fill="#6EE7B7" font-family="sans-serif" font-size="9" font-weight="bold">DATABASE SUBNETS • Multi-AZ RDS PostgreSQL</text>
    <rect x="130" y="196" width="115" height="22" rx="4" fill="#065F46"/>
    <text x="187" y="211" fill="#A7F3D0" font-family="sans-serif" font-size="8.5" text-anchor="middle" font-weight="bold">RDS Primary (AZ-A)</text>
    <rect x="265" y="196" width="115" height="22" rx="4" fill="#065F46" opacity="0.6"/>
    <text x="322" y="211" fill="#A7F3D0" font-family="sans-serif" font-size="8.5" text-anchor="middle">RDS Standby (AZ-B)</text>
  </g>
</svg>