      <text x="342" y="20" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Drift Check</text>
      <line x1="385" y1="16" x2="400" y2="16" stroke="#10B981" stroke-width="2"/>

      <rect x="400" y="0" width="80" height="32" rx="6" fill="#065F46" stroke="#10B981"/>
      <text x="440" y="20" fill="#A7F3D0" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">Serve Streamlit</text>
    </g>

    <!-- Time Series Forecast Curve -->
    <rect x="0" y="90" width="510" height="145" rx="8" fill="#0A0E1A" stroke="#1E293B"/>
    <text x="16" y="112" fill="#94A3B8" font-family="sans-serif" font-size="10.5" font-weight="bold">Historical Sales (Solid) vs 12-Week Demand Forecast Band (Dashed)</text>
    
    <!-- Graph -->
    <path d="M 30 190 Q 70 160, 110 180 T 190 150 T 270 170 T 350 140" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
    <!-- Forecast Cone -->
    <polygon points="350,140 470,110 470,170 350,140" fill="#A855F7" opacity="0.2"/>
    <path d="M 350 140 Q 410 125, 470 140" fill="none" stroke="#C084FC" stroke-width="2.5" stroke-dasharray="4"/>
    <circle cx="350" cy="140" r="4" fill="#C084FC"/>
    <text x="345" y="130" fill="#C084FC" font-family="sans-serif" font-size="9" font-weight="bold">T=0</text>
    <text x="475" y="143" fill="#A855F7" font-family="sans-serif" font-size="10" font-weight="bold">MAPE: 4.8%</text>
