<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/><stop offset="100%" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="bar5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg5)"/>
  
  <rect x="30" y="20" width="540" height="300" rx="12" fill="#0A0E1A" stroke="#1E293B" stroke-width="2"/>
  <rect x="30" y="20" width="540" height="36" rx="12" fill="#141E33"/>
  <rect x="30" y="44" width="540" height="12" fill="#141E33"/>
  <circle cx="50" cy="38" r="4.5" fill="#EF4444"/>
  <circle cx="65" cy="38" r="4.5" fill="#F59E0B"/>
  <circle cx="80" cy="38" r="4.5" fill="#10B981"/>
  <text x="100" y="42" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">Executive Sales KPI & Dimensional Data Mart</text>
  
  <rect x="440" y="27" width="115" height="22" rx="5" fill="#0E1726" stroke="#38BDF8" stroke-width="1"/>
  <text x="497" y="42" fill="#38BDF8" font-family="monospace" font-size="9.5" font-weight="bold" text-anchor="middle">POWER BI + DBT + SNOWFLAKE</text>
  
  
  
  <g transform="translate(45, 68)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="160" height="60" rx="8" fill="#111E2E" stroke="#1E3A5F"/>
    <text x="15" y="22" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="bold">ANNUAL RECURRING REV</text>
    <text x="15" y="46" fill="#FFFFFF" font-family="sans-serif" font-size="18" font-weight="bold">$4.82M <tspan fill="#34D399" font-size="11">+18.4%</tspan></text>

    <!-- KPI 2 -->
    <rect x="175" y="0" width="160" height="60" rx="8" fill="#111E2E" stroke="#1E3A5F"/>
    <text x="190" y="22" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="bold">AVG CUSTOMER LTV</text>
    <text x="190" y="46" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="bold">$12,450</text>

    <!-- KPI 3 -->
    <rect x="350" y="0" width="160" height="60" rx="8" fill="#111E2E" stroke="#1E3A5F"/>
    <text x="365" y="22" fill="#94A3B8" font-family="sans-serif" font-size="9.5" font-weight="bold">STAR SCHEMA TABLES</text>
    <text x="365" y="46" fill="#A78BFA" font-family="sans-serif" font-size="18" font-weight="bold">6 Dims • 2 Facts</text>

    <!-- Barchart View -->
    <rect x="0" y="72" width="510" height="165" rx="8" fill="#0A101D" stroke="#1E293B"/>
    <text x="16" y="94" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="bold">Quarterly Revenue vs Target Variance (dbt Fact Table Aggregate)</text>
    
    <!-- Bars -->
    <g transform="translate(30, 110)">
      <!-- Q1 -->
      <rect x="20" y="40" width="40" height="50" rx="4" fill="url(#bar5)"/>
      <rect x="65" y="25" width="40" height="65" rx="4" fill="#10B981"/>
      <text x="62" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Q1 Actual / Target</text>

      <!-- Q2 -->
      <rect x="140" y="30" width="40" height="60" rx="4" fill="url(#bar5)"/>
      <rect x="185" y="15" width="40" height="75" rx="4" fill="#10B981"/>
      <text x="182" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Q2 Actual / Target</text>

      <!-- Q3 -->
      <rect x="260" y="20" width="40" height="70" rx="4" fill="url(#bar5)"/>
      <rect x="305" y="8" width="40" height="82" rx="4" fill="#10B981"/>
      <text x="302" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Q3 Actual / Target</text>

      <!-- Q4 Projection -->
      <rect x="380" y="10" width="40" height="80" rx="4" fill="url(#bar5)" opacity="0.6"/>
      <rect x="425" y="0" width="40" height="90" rx="4" fill="#10B981" opacity="0.6"/>
      <text x="422" y="105" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Q4 Forecast</text>
    </g>
  </g>
</svg>